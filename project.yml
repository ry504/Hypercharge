name: Hypercharge
options:
  bundleIdPrefix: com.ryanfong
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Hypercharge:
    type: application
    platform: macOS
    sources:
      - Sources
    postBuildScripts:
      - name: "Copy App Icon"
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Resources/AppIcon.icns" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
    info:
      path: Sources/Info.plist
      properties:
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleName: Hypercharge
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAccessibilityUsageDescription: Hypercharge monitors app windows so it can quit apps when their last window is closed.
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfong.hypercharge
        PRODUCT_NAME: Hypercharge
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: 14.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Sources/Hypercharge.entitlements
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  HyperchargeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Hypercharge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfong.hypercharge.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"

schemes:
  Hypercharge:
    build:
      targets:
        Hypercharge: all
        HyperchargeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HyperchargeTests
    profile:
      config: Release
    archive:
      config: Release
